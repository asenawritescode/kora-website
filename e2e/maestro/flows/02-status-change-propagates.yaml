# The core proof: a status changed in Cloud shows on the website on the next load.
url: ${BASE}
name: an attestation in Cloud changes the Modules page
---
- openLink: ${BASE}/modules
- assertVisible: "14 modules: 2 available, 1 in preview, 11 on the roadmap.*"
- runScript:
    file: ../scripts/cloud.js
    env:
      ACTION: attest-purchasing-available
- openLink: ${BASE}/modules
- assertVisible: "14 modules: 3 available, 0 in preview, 11 on the roadmap.*"
- runScript:
    file: ../scripts/cloud.js
    env:
      ACTION: attest-purchasing-preview
- openLink: ${BASE}/modules
- assertVisible: "14 modules: 2 available, 1 in preview, 11 on the roadmap.*"
