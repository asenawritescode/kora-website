server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Removed pages (keep in sync with redirects.json; scripts/check-links.ts verifies)
    location = /benefits { return 301 /; }
    location = /ai-builder { return 301 /; }

    # Each route has its own prerendered head: dist/<route>/index.html (see scripts/seo-head.ts).
    # Unknown paths get a real 404 with a noindex head; the page still boots the SPA.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Blog posts load from the CMS at runtime, so they get the shell without a canonical URL.
    location ~ ^/blog/.+ {
        try_files /200.html =404;
    }

    # Template pages load from the Cloud catalog at runtime, so they get the shell too.
    location ~ ^/templates/.+ {
        try_files /200.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Immutable cache for hashed assets
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
